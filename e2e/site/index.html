<!doctype html>
<html><head><meta charset="utf-8"><title>Acme Bank — Profile</title>
<style>
 body{font:18px/1.6 system-ui,sans-serif;margin:24px;color:#222} .row{margin:6px 0} label{display:inline-block;width:160px}
 input{font-size:18px;padding:4px 8px;width:300px} button{font-size:18px;padding:8px 18px;margin:10px 8px 0 0}

<body>
