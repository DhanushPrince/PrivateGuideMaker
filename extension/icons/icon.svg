<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="40 22 260 290" role="img" aria-labelledby="title desc">
  <title id="title">Private Guide Maker — Navy theme</title>
  <desc id="desc">Navy and blue document logo with three numbered steps, a redacted middle step, and a privacy shield, beside the Private Guide Maker wordmark.</desc>
  <defs>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Document outline and folded corner -->
  <path d="M72 54 Q72 34 92 34 H190 L246 90 V270 Q246 290 226 290 H92 Q72 290 72 270 Z"
        fill="#FFFFFF" stroke="url(#blueAccent)" stroke-width="9" stroke-linejoin="round"/>
  <path d="M190 36 V74 Q190 90 206 90 H244" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="7" stroke-linejoin="round"/>
  <!-- Step 1 -->
  <circle cx="112" cy="119" r="17" fill="#1E3A8A"/>
  <text x="112" y="126" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle" fill="#FFFFFF">1</text>
  <path d="M143 112 H207 M143 126 H188" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
  <!-- Step 2 / redaction -->
  <circle cx="112" cy="166" r="17" fill="#1E3A8A"/>
  <text x="112" y="173" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle" fill="#FFFFFF">2</text>
  <path d="M143 159 H210" fill="none" stroke="#93C5FD" stroke-width="7" stroke-linecap="round"/>
  <g opacity="0.95">
    <rect x="143" y="151" width="12" height="16" rx="2" fill="#BFDBFE"/>
    <rect x="156" y="151" width="12" height="16" rx="2" fill="#60A5FA"/>
    <rect x="169" y="151" width="12" height="16" rx="2" fill="#DBEAFE"/>
    <rect x="182" y="151" width="12" height="16" rx="2" fill="#93C5FD"/>
    <rect x="195" y="151" width="12" height="16" rx="2" fill="#BFDBFE"/>
  </g>
  <!-- Step 3 -->
  <circle cx="112" cy="213" r="17" fill="#1E3A8A"/>
  <text x="112" y="220" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle" fill="#FFFFFF">3</text>
  <path d="M143 206 H207 M143 220 H185" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
  <!-- Shield badge -->
  <path d="M224 190 L272 208 V238 Q272 270 244 286 L224 297 L204 286 Q176 270 176 238 V208 Z"
        fill="#1E3A8A" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
  <path d="M213 235 V226 A11 11 0 0 1 235 226 V235" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <rect x="207" y="233" width="34" height="27" rx="5" fill="#FFFFFF"/>
  <circle cx="224" cy="245" r="4" fill="#1E3A8A"/>
  <path d="M224 248 V253" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round"/>
  </svg>
