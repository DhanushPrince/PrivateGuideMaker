# SonarCloud configuration. Replace YOUR_ORG with your SonarCloud organization key
# (see "SonarCloud setup" in README.md).
sonar.organization=YOUR_ORG
sonar.projectKey=YOUR_ORG_private-guide-maker
sonar.projectName=Private Guide Maker

sonar.sources=extension,scripts
sonar.tests=test,e2e
sonar.exclusions=node_modules/**,e2e/output/**,dist/**
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions. `npm run test:coverage` runs the Node unit tests (test/*.test.js),
# and those can only load code that runs in plain Node, which today is extension/lib/pii.js.
# Everything listed below needs the browser: chrome.* extension APIs, the DOM, canvas,
# IndexedDB or the side panel. It is tested end to end by the Playwright suite in e2e/
# (`npm run test:e2e`, 40 checks in a real Chromium), which doesn't produce lcov data.
# Counting these files as 0% covered would only add noise to the coverage gate.
# e2e/** is test code itself, and scripts/** is the build-time zip tool.
sonar.coverage.exclusions=\
  extension/background/**,\
  extension/content/**,\
  extension/dashboard/**,\
  extension/sidepanel/**,\
  extension/viewer/**,\
  extension/lib/ai-titles.js,\
  extension/lib/annotations.js,\
  extension/lib/confirm-modal.js,\
  extension/lib/export.js,\
  extension/lib/storage.js,\
  extension/lib/vendor/**,\
  e2e/**,\
  scripts/**
